<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הצעות מחיר - Spicy Social Media</title>
<meta name="description" content="מחולל הצעות מחיר לעסק Spicy Social Media של שחר תורג'מן">
<meta name="theme-color" content="#c32a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הצעות מחיר">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="app-header">
    <img class="logo" src="assets/spicy-logo.png" alt="Spicy Social Media">
    <div class="titles">
      <h1>מחולל הצעות מחיר</h1>
      <p>שלושה שלבים קצרים ויש לך הצעת מחיר מעוצבת, מוכנה לשליחה</p>
    </div>
  </header>

  <ol class="step-indicator" id="step-indicator"></ol>

  <div class="card">
    <div id="step-body"></div>
    <p class="error-box" id="step-error" style="display:none;"></p>
    <div class="step-nav">
      <button type="button" class="btn btn-ghost" id="back-btn">→ חזרה</button>
      <button type="button" class="btn btn-primary" id="next-btn">הבא</button>
    </div>
  </div>
</div>

<div class="preview-overlay" id="preview-overlay">
  <div class="preview-inner">
    <div class="preview-toolbar">
      <button type="button" class="btn btn-ghost" id="close-preview-btn">→ חזרה לעריכה</button>
      <button type="button" class="btn btn-primary" id="download-btn">שמירה כ-PDF</button>
    </div>
    <p class="print-hint">ייפתח חלון הדפסה. באייפון: הקשה על תצוגת ההדפסה למסך מלא (או צביטה עליה), ואז על סמל השיתוף למטה ← "שמירה בקבצים". במחשב: לבחור יעד "Save as PDF".</p>
    <div class="preview-pages">
      <div class="doc-shadow">
        <div id="doc-page1" style="width:794px;min-width:794px;min-height:1123px;flex-shrink:0;display:flex;flex-direction:column;background:#ffffff;color:#1f2430;font-family:'Heebo',sans-serif;"></div>
      </div>
      <div class="doc-shadow" id="doc-page2-wrap">
        <div id="doc-page2" style="width:794px;min-width:794px;min-height:1123px;flex-shrink:0;display:flex;flex-direction:column;background:#ffffff;color:#1f2430;font-family:'Heebo',sans-serif;"></div>
      </div>
    </div>
    <div class="new-quote-link">
      <button type="button" id="new-quote-btn">התחלת הצעת מחיר חדשה</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
